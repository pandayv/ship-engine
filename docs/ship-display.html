<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHIP — display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f2f4f2; --surface: #ffffff; --ink: #14181a; --ink-soft: #52605c;
  --border: #dde3e0; --border-strong: #c7d0cc;
  --agent: #0d6e5c; --agent-tint: #e6f2ef;
  --infra: #3f5568; --infra-tint: #e7ecf0;
  --blocked: #b5432f; --blocked-tint: #fbeae6;
  --review: #a15c1f; --review-tint: #f7ecdf;
  --muted-stroke: #b7c0bc; --muted-text: #8b968f;
  --shadow: 0 1px 2px rgba(20,24,26,0.04), 0 6px 16px rgba(20,24,26,0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181a; --surface: #1a2225; --ink: #eef2ef; --ink-soft: #a9b6b1;
    --border: #2c3a37; --border-strong: #3c4d49;
    --agent: #4fd9b8; --agent-tint: #16332c;
    --infra: #9fb3c8; --infra-tint: #202b34;
    --blocked: #e2735c; --blocked-tint: #3a2019;
    --review: #e0a052; --review-tint: #3a2a15;
    --muted-stroke: #3c4a46; --muted-text: #5f6b67;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #12181a; --surface: #1a2225; --ink: #eef2ef; --ink-soft: #a9b6b1;
  --border: #2c3a37; --border-strong: #3c4d49;
  --agent: #4fd9b8; --agent-tint: #16332c;
  --infra: #9fb3c8; --infra-tint: #202b34;
  --blocked: #e2735c; --blocked-tint: #3a2019;
  --review: #e0a052; --review-tint: #3a2a15;
  --muted-stroke: #3c4a46; --muted-text: #5f6b67;
  --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
  font-size: 15px; line-height: 1.55;
}
.page { max-width: 860px; margin: 0 auto; padding: 28px 22px 60px; min-height: 100vh; display: flex; flex-direction: column; }

/* ---- ambient top bar: always visible, tells you this thing is alive ---- */
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted-stroke); flex-shrink: 0; transition: background .3s; }
.dot.live { background: var(--agent); box-shadow: 0 0 0 3px var(--agent-tint); }
.dot.alert { background: var(--blocked); box-shadow: 0 0 0 3px var(--blocked-tint); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.status-line { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-soft); letter-spacing: .01em; }
.status-line b { color: var(--ink); font-weight: 600; }
.rename { margin-left: auto; font-size: 11.5px; color: var(--ink-soft); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 4px; }

/* ---- naming prompt, first run only ---- */
.namebox {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); padding: 28px; margin: auto; max-width: 420px; text-align: center;
}
.namebox h1 { font-family: "Fraunces", Georgia, serif; font-size: 1.3rem; font-weight: 600; margin: 0 0 6px; }
.namebox p { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 16px; }
.namebox input {
  width: 100%; font: inherit; font-size: 15px; padding: 10px 13px; margin-bottom: 10px;
  border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg); color: var(--ink); text-align: center;
}
.namebox .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.namebox .preset {
  font-size: 12.5px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-strong);
  background: var(--bg); color: var(--ink-soft); cursor: pointer;
}
.namebox .preset:hover { border-color: var(--agent); color: var(--agent); }
.namebox button.go {
  font: inherit; font-weight: 600; font-size: 14px; padding: 10px 22px; border-radius: 9px;
  border: 1px solid var(--agent); background: var(--agent); color: #fff; cursor: pointer;
}
:root[data-theme="dark"] .namebox button.go, :root:not([data-theme="light"]) .namebox button.go { color: #0e1414; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .namebox button.go { color: #fff; } }

/* ---- ambient idle state ---- */
.idle { margin: auto; text-align: center; color: var(--ink-soft); }
.idle .glyph { font-size: 40px; margin-bottom: 10px; opacity: .5; }
.idle .headline { font-family: "Fraunces", Georgia, serif; font-size: 1.3rem; color: var(--ink); margin-bottom: 4px; }
.idle .sub { font-size: 13px; }

/* ---- the revealed screen ---- */
.screen-wrap { display: none; }
.screen-wrap.show { display: block; animation: in .4s ease; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.screen { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.screen-bar {
  display: flex; align-items: center; gap: 8px; padding: 11px 18px; background: var(--infra-tint);
  font-family: "JetBrains Mono", monospace; font-size: 11.5px; letter-spacing: .04em; color: var(--infra); text-transform: uppercase;
}
.screen-body { padding: 20px 22px 24px; }
.finding { border: 1px solid var(--border); border-left: 3px solid var(--stripe, var(--border-strong)); border-radius: 9px; padding: 14px 16px; margin-bottom: 11px; }
.finding.blocking { --stripe: var(--blocked); }
.finding.review { --stripe: var(--review); }
.f-top { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; flex-wrap: wrap; }
.pill { font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.pill.blocking { background: var(--blocked-tint); color: var(--blocked); }
.pill.review { background: var(--review-tint); color: var(--review); }
.f-file { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-soft); }
.f-what { margin: 0 0 6px; font-size: 14.5px; }
.f-cite { display: inline-block; font-family: "JetBrains Mono", monospace; font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; color: var(--ink-soft); }
.empty-state { color: var(--ink-soft); text-align: center; padding: 22px; font-size: 13.5px; }
.decision-box { display: none; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="dot" id="dot"></div>
    <div class="status-line" id="statusLine">connecting…</div>
    <button class="rename" id="renameBtn" hidden>rename</button>
  </div>

  <div class="namebox" id="namebox" hidden>
    <h1>What is this device?</h1>
    <p>SHIP will push findings here the instant someone asks Alexa to show them on this device.</p>
    <input id="nameInput" type="text" placeholder="e.g. TV, iPad, Kitchen">
    <div class="row">
      <button class="preset" data-name="tv">TV</button>
      <button class="preset" data-name="ipad">iPad</button>
      <button class="preset" data-name="laptop">Laptop</button>
      <button class="preset" data-name="fridge">Fridge</button>
    </div>
    <button class="go" id="nameGo">Start watching</button>
  </div>

  <div class="idle" id="idle" hidden>
    <div class="glyph">◎</div>
    <div class="headline">All clear</div>
    <div class="sub">Watching as <b id="idleName"></b> — nothing pushed yet.</div>
  </div>

  <div class="screen-wrap" id="screenWrap">
    <div class="screen">
      <div class="screen-bar" id="screenBar">SHIP release status</div>
      <div class="screen-body" id="screenBody"></div>
    </div>
  </div>
</div>

<script src="ship-render.js"></script>
<script>
"use strict";

// No token, no auth — this is a DISPLAY-only surface. It can only
// receive a push and render it; nothing here can resolve a finding or
// touch Gate. Deliberately no "consoleUrl" passed to shipRenderFindings,
// so the decision box never renders here — resolving a risk still
// requires a person at Gate with a typed reason, never from a screen
// nobody is necessarily standing in front of.
const WS_URL = "wss://9vkr6eelzd.execute-api.us-west-2.amazonaws.com/prod";
const STORAGE_KEY = "ship_display_device_name";

const dot = document.getElementById("dot");
const statusLine = document.getElementById("statusLine");
const renameBtn = document.getElementById("renameBtn");
const namebox = document.getElementById("namebox");
const nameInput = document.getElementById("nameInput");
const idle = document.getElementById("idle");
const idleName = document.getElementById("idleName");
const screenWrap = document.getElementById("screenWrap");
const screenBar = document.getElementById("screenBar");
const screenBody = document.getElementById("screenBody");

let ws = null;
let reconnectDelayMs = 1000;
let deviceName = null;

function setStatus(text, cls) {
  statusLine.innerHTML = text;
  dot.className = "dot" + (cls ? " " + cls : "");
}

function showIdle() {
  namebox.hidden = true;
  screenWrap.classList.remove("show");
  idle.hidden = false;
  idleName.textContent = deviceName;
}

function showNamePrompt() {
  idle.hidden = true;
  screenWrap.classList.remove("show");
  namebox.hidden = false;
  nameInput.focus();
}

function connect() {
  setStatus("connecting…");
  ws = new WebSocket(WS_URL);

  ws.addEventListener("open", () => {
    reconnectDelayMs = 1000; // reset backoff on a real successful connect
    ws.send(JSON.stringify({ action: "register", device_name: deviceName }));
  });

  ws.addEventListener("message", (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if ("registered" in msg) {
      setStatus("watching as <b>" + shipEsc(msg.registered) + "</b>", "live");
      renameBtn.hidden = false;
      showIdle();
      return;
    }

    // Anything else is a real findings push — same payload shape as
    // blocked_pull_requests, rendered with the identical shared code
    // the simulator uses so the two surfaces can never disagree on how
    // a finding looks.
    idle.hidden = true;
    screenWrap.classList.add("show");
    const anyBlocking = (msg.pull_requests || []).some(pr => pr.findings.some(f => f.blocks_merge));
    dot.className = "dot" + (anyBlocking ? " alert" : " live");
    shipRenderFindings(screenBar, screenBody, "SHIP release status", msg);
  });

  ws.addEventListener("close", () => {
    // Required, not optional: API Gateway WebSocket connections drop on
    // a 10-minute idle timeout or a 2-hour hard cap, neither
    // configurable (confirmed against AWS's own quota docs before
    // building this) — an ambient display with no reconnect logic would
    // silently stop working partway through the day it's meant to sit
    // there. Exponential backoff, capped, so a genuine outage doesn't
    // hammer the API.
    setStatus("reconnecting…");
    dot.className = "dot";
    setTimeout(connect, reconnectDelayMs);
    reconnectDelayMs = Math.min(reconnectDelayMs * 1.6, 15000);
  });

  ws.addEventListener("error", () => { ws.close(); });
}

function startWatching(name) {
  deviceName = name.trim();
  if (!deviceName) return;
  localStorage.setItem(STORAGE_KEY, deviceName);
  connect();
}

document.getElementById("nameGo").addEventListener("click", () => startWatching(nameInput.value));
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") startWatching(nameInput.value); });
document.querySelectorAll(".preset").forEach(b => b.addEventListener("click", () => startWatching(b.dataset.name)));
renameBtn.addEventListener("click", () => {
  if (ws) ws.close();
  showNamePrompt();
});

const saved = (() => { try { return localStorage.getItem(STORAGE_KEY); } catch { return null; } })();
if (saved) startWatching(saved);
else showNamePrompt();
</script>
</body>
</html>
