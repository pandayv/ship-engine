<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SHIP — Sign in</title>
  <style>
    body { font-family: -apple-system, sans-serif; color: #1a1a1a; }
    .wrap { max-width: 360px; margin: 18vh auto 0; padding: 0 1rem; }
    h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-bottom: 1.75rem; font-size: 0.92rem; }
    form { border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
    input { width: 100%; box-sizing: border-box; font: inherit; font-size: 0.95rem;
      padding: 0.55rem 0.65rem; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 0.9rem; }
    button { width: 100%; background: #1a1a1a; color: white; border: none; border-radius: 6px;
      padding: 0.6rem 1rem; cursor: pointer; font-size: 0.95rem; }
    .error { background: #fbeae6; color: #c0392b; border-radius: 6px; padding: 0.6rem 0.75rem;
      font-size: 0.88rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SHIP — Gate</h1>
    <div class="subtitle">The access token from your invite gets you in once — after that, you're signed in.</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/dashboard/login">
      <label for="token">Access token</label>
      <input id="token" name="token" type="password" autofocus required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
